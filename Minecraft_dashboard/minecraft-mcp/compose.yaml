services:
  minecraft-mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - minecraft-tools

networks:
  minecraft-tools:
    name: minecraft-tools
