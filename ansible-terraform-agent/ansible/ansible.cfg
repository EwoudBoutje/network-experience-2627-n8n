[defaults]
inventory = inventory/mcp.yml
roles_path = roles
collections_path = /usr/share/ansible/collections
local_tmp = /tmp/infra-agent/.ansible-tmp
# Onder /tmp: de control-container is read-only, en op de VM's werkt dit voor elke gebruiker.
remote_tmp = /tmp/.ansible-${USER}/tmp
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
